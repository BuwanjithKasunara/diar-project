name: Backend regression
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
          cache: pip
          cache-dependency-path: backend/requirements-lock.txt
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip check
      - run: python -m pytest tests -q
      - run: python train_ml_model.py --output evaluation-ci.json
